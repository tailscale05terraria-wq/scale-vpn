name: Build Scale VPN (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Сборка Android APK (с ядром VPN)
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание репозитория
        uses: actions/checkout@v4

      - name: Установка Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Установка Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Генерация Android и настройка VpnService
        run: |
          cp pubspec.yaml pubspec.backup.yaml
          flutter create --project-name scale_vpn --platforms=android --org com.scalevpn .
          cp pubspec.backup.yaml pubspec.yaml
          
          # Универсальное повышение версии до 24 для build.gradle и build.gradle.kts
          find android/ -type f -name "build.gradle*" -exec sed -i 's/flutter.minSdkVersion/24/g' {} + || true
          find android/ -type f -name "build.gradle*" -exec sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' {} + || true
          
          # Добавляем права на уведомления (Android 13+) и системный VPN
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' android/app/src/main/AndroidManifest.xml || true
          
          flutter pub get

      - name: Компиляция APK
        run: flutter build apk --release

      - name: Выгрузка готового APK файла
        uses: actions/upload-artifact@v4
        with:
          name: ScaleVPN-Android
          path: build/app/outputs/flutter-apk/app-release.apk

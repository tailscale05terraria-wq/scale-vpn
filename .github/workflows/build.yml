name: Build Scale VPN (APK & Windows)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Сборка Android APK (с ядром VPN)
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание репозитория
        uses: actions/checkout@v4

      - name: Установка Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Установка Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Генерация Android и настройка VpnService
        run: |
          cp pubspec.yaml pubspec.backup.yaml
          flutter create --project-name scale_vpn --platforms=android --org com.scalevpn .
          cp pubspec.backup.yaml pubspec.yaml
          
          # ЖЕЛЕЗОБЕТОННОЕ повышение версии Android до 24 (требование Xray)
          sed -i 's/flutter.minSdkVersion/24/g' android/app/build.gradle
          
          # Добавляем права на уведомления (Android 13+) и системный VPN
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' android/app/src/main/AndroidManifest.xml
          
          flutter pub get

      - name: Компиляция APK
        run: flutter build apk --release

      - name: Выгрузка готового APK файла
        uses: actions/upload-artifact@v4
        with:
          name: ScaleVPN-Android
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Сборка Windows Desktop
    runs-on: windows-latest
    continue-on-error: true # Сборка упадет из-за flutter_v2ray, но не прервет выдачу APK
    steps:
      - name: Скачивание репозитория
        uses: actions/checkout@v4

      - name: Установка Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Генерация Windows
        shell: bash
        run: |
          cp pubspec.yaml pubspec.backup.yaml
          flutter create --project-name scale_vpn --platforms=windows --org com.scalevpn .
          cp pubspec.backup.yaml pubspec.yaml
          flutter pub get

      - name: Компиляция для Windows
        run: flutter build windows --release

      - name: Выгрузка программы для Windows
        uses: actions/upload-artifact@v4
        with:
          name: ScaleVPN-Windows
          path: build/windows/x64/runner/Release/
